name: LeetCode Streak Guardian

on:
  schedule:
    # Every 10 minutes from 04:00 to 23:50 UTC = 9:30 AM to 5:20 AM IST.
    # This covers the full reminder window and tolerates GitHub schedule delays.
    - cron: '*/10 4-23 * * *'

  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test Telegram message now'
        required: false
        type: boolean
        default: false

concurrency:
  group: leetcode-streak-guardian
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardian:
    name: Check streak and send reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      # Reminder state only. Session cookies are never cached.
      - name: Restore reminder state
        uses: actions/cache/restore@v6
        with:
          path: runtime/state.json
          key: guardian-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            guardian-state-

      - name: Run guardian
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME || secrets.LEETCODE_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            node src/runOnce.js --test-alert
          else
            node src/runOnce.js
          fi

      - name: Save reminder state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: runtime/state.json
          key: guardian-state-${{ github.run_id }}-${{ github.run_attempt }}
