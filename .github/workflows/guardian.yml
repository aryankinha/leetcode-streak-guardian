name: LeetCode Streak Guardian

on:
  # Scheduling lives in scheduler/ (Cloudflare Worker, every 10 minutes from
  # 04:00 to 23:50 UTC). GitHub's `schedule` trigger was removed because it
  # delays and drops runs under load, and public repositories auto-disable
  # scheduled workflows after 60 days without activity.
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test Telegram message now'
        required: false
        type: boolean
        default: false

concurrency:
  group: leetcode-streak-guardian
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guardian:
    name: Check streak and send reminders
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      # Reminder state and the daily recommendation cache. Session cookies are
      # never cached.
      - name: Restore reminder state
        uses: actions/cache/restore@v6
        with:
          path: |
            runtime/state.json
            runtime/recommendation.json
          key: guardian-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            guardian-state-

      # The cache action errors when a requested path does not exist. Touching
      # the files keeps a first run or an early submission from failing the job.
      - name: Ensure runtime files exist
        run: |
          mkdir -p runtime
          touch runtime/state.json runtime/recommendation.json

      - name: Run guardian
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME || secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRFTOKEN: ${{ secrets.LEETCODE_CSRFTOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            node src/runOnce.js --test-alert
          else
            node src/runOnce.js
          fi

      - name: Save reminder state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            runtime/state.json
            runtime/recommendation.json
          key: guardian-state-${{ github.run_id }}-${{ github.run_attempt }}
